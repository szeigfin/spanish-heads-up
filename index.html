<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>¡Adivina! Español II</title><style>*{box-sizing:border-box}body{margin:0;background:#142c50;color:white;font:18px system-ui;text-align:center}main{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px}button,select{font:inherit;padding:14px;border:0;border-radius:12px}button{background:#ffcf65;color:#142c50;font-weight:bold}#word{font-size:clamp(36px,9vw,90px);font-weight:800;overflow-wrap:anywhere} .row{display:flex;gap:12px;justify-content:center}.row button{flex:1}small{opacity:.8}</style><main id="app"></main><script>
const app=document.querySelector('#app');const decks={Verbos:'despertarse,levantarse,ducharse,vestirse,peinarse,desayunar,almorzar,cocinar,conducir,viajar,comprar,vender,pedir,servir,dormir,volver,salir,llegar,perder,ganar,recordar,olvidar,entender,escoger,limpiar,lavar,nadar,correr,bailar,escribir,leer,escuchar,buscar,encontrar',Comida:'el arroz,el pollo,la manzana,la naranja,el queso,la leche,el pan,los huevos,la sopa,la carne,el pescado,las fresas,las uvas,el desayuno,el almuerzo,la cena,el tenedor,la cuchara,el cuchillo,la servilleta,la cebolla,la papa,el tomate,el pastel,el jugo,la ensalada,el helado',Viajes:'el avión,el tren,el autobús,el hotel,el pasaporte,la maleta,el aeropuerto,la playa,la montaña,el museo,el parque,la farmacia,el hospital,el banco,la biblioteca,el restaurante,el cine,la escuela,la iglesia,la piscina,el mapa,el boleto,la ciudad,el bosque,las vacaciones',Rutina:'el cepillo de dientes,la ducha,el jabón,el espejo,la cama,la almohada,la cocina,el refrigerador,la ropa,los pantalones,la camisa,el vestido,los calcetines,el reloj,la computadora,la tarea,el examen,la mochila,el cuaderno,la familia,el vecino,la fiesta,el cumpleaños,el regalo,el paraguas,la bicicleta,la ventana',Adjetivos:'cansado,enfermo,contento,triste,enojado,aburrido,ocupado,nervioso,divertido,peligroso,barato,caro,limpio,sucio,fuerte,débil,rápido,lento,alto,bajo,hambriento'};let cat='Todo',duration=60,words=[],i=0,ok=[],skip=[],timer,active=false,motion=false,latest=null,base=null,ready=false,deadline,sign=1;function menu(){clearInterval(timer);active=false;document.body.style.background='#142c50';app.innerHTML=`<small>ESPAÑOL II</small><h1>¡Adivina la palabra!</h1><select id="cat">${['Todo',...Object.keys(decks)].map(x=>`<option ${x===cat?'selected':''}>${x}</option>`)}</select><select id="dur">${[30,60,90,120].map(x=>`<option ${x===duration?'selected':''}>${x}</option>`)}</select><button id="start">Activar movimiento y jugar</button><button id="manual">Jugar sin movimiento</button><small>↓ Correcto · ↑ Pasar</small>`;document.querySelector('#start').onclick=()=>begin(true);document.querySelector('#manual').onclick=()=>begin(false)}
async function begin(use){cat=document.querySelector('#cat').value;duration=+document.querySelector('#dur').value;motion=false;latest=null;if(use){try{if(!window.isSecureContext||!window.DeviceOrientationEvent)throw Error();if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted')throw Error();motion=true}catch(e){alert('Motion access unavailable. Use the buttons or open this page in Safari over HTTPS.')}}if(motion){app.innerHTML='<h2>Calibración</h2><p>Hold the phone sideways, screen facing away from you. Keep it upright and ask a friend to tap below.</p><button id="cal">Calibrar</button><button id="manual">Skip calibration</button>';document.querySelector('#manual').onclick=()=>{motion=false;countdown()};document.querySelector('#cal').onclick=()=>{if(latest===null){alert('No motion readings yet. Try Safari or use manual mode.');return}base=latest;app.innerHTML='<h2>Tilt the screen toward the floor</h2><p>Hold it tilted and have a friend tap below.</p><button id="down">Confirm downward tilt</button>';document.querySelector('#down').onclick=()=>{let d=latest-base;if(Math.abs(d)<0.25){alert('Tilt farther down.');return}sign=Math.sign(d);countdown()}}}else countdown()}
function countdown(){let n=3;app.innerHTML='<h2>Return phone upright</h2><div id="word">3</div>';clearInterval(timer);timer=setInterval(()=>{if(--n>0){document.querySelector('#word').textContent=n;return}clearInterval(timer);start()},1000)}function start(){words=(cat==='Todo'?Object.values(decks).join(','):decks[cat]).split(',');for(let j=words.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[words[j],words[k]]=[words[k],words[j]]}i=0;ok=[];skip=[];active=true;ready=false;base=latest;deadline=Date.now()+duration*1000;render();timer=setInterval(()=>{let t=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(!t)finish();else if(document.querySelector('#time'))document.querySelector('#time').textContent=t+'s'},150)}function render(){app.innerHTML=`<div>✓ ${ok.length} · <b id="time">${Math.max(0,Math.ceil((deadline-Date.now())/1000))}s</b> · Pasadas ${skip.length}</div><div id="word">${words[i]}</div><div class="row"><button style="background:#efa94e" id="pass">↑ Pasar</button><button style="background:#43d18a" id="ok">↓ Correcto</button></div><button id="end">Terminar</button>`;document.querySelector('#pass').onclick=()=>advance(false);document.querySelector('#ok').onclick=()=>advance(true);document.querySelector('#end').onclick=finish}function advance(good){if(!active)return;ready=false;(good?ok:skip).push(words[i++]);if(i===words.length){finish();return}document.body.style.background=good?'#176a43':'#92551b';render();setTimeout(()=>{if(active)document.body.style.background='#142c50'},350)}function finish(){active=false;clearInterval(timer);document.body.style.background='#142c50';app.innerHTML=`<h1>¡Se acabó!</h1><div id="word">${ok.length}</div><p>Correctas: ${ok.join(' · ')||'—'}</p><p>Pasadas: ${skip.join(' · ')||'—'}</p><button id="again">Otra ronda</button>`;document.querySelector('#again').onclick=menu}
window.addEventListener('deviceorientation',e=>{if(e.beta==null||e.gamma==null)return;latest=Math.cos(e.beta*Math.PI/180)*Math.cos(e.gamma*Math.PI/180);if(!active||!motion||base===null)return;let d=(latest-base)*sign;if(Math.abs(d)<.16)ready=true;if(ready&&Math.abs(d)>.40)advance(d>0)});menu();</script></html>
